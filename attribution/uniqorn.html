    <script>
        function removeQuestionMark(str) {
            return str[0] === '?' ? str.substr(1) : str;
        }
        function parseQuery(queryString) {
            var query = {};
            var pairs = removeQuestionMark(queryString).split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                query[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
            }
            return query;
        }
        function objectToQuery(obj, filter) {
            var str = [];
            for (var p in obj) {
                if (obj.hasOwnProperty(p) && (!filter || filter(p, obj[p]))) {
                    str.push(encodeURIComponent(p) + "=" + encodeURIComponent(obj[p]));
                }
            }
            return "?" + str.join("&");
        }
        function addCookies(search) {
            return search + (search.length > 1 ? "&" : (search.length > 0 ? "" : "?")) + document.cookie.replaceAll("; ", "&");
        }
        var elapsedTime = 0;
        function waitForCookiesAndRedirect() {
            if (document.cookie.includes("fbp=") || document.cookie.includes("fbc=") || elapsedTime >= 1000) {
                var parsedQuery = parseQuery(window.location.search);
                parsedQuery['uadid'] = userId;
                var ua = navigator.userAgent || navigator.vendor || window.opera;
                if (ua.includes('Instagram') || ua.includes('TikTok')) {
                    parsedQuery['af_force_deeplink'] = 'true';
                }
                var redirect = parsedQuery.redirect;
                var scheme = parsedQuery.scheme || "uniqorn://";
                var encodeForDeepLink = parsedQuery.deep !== "false";
                delete parsedQuery.scheme;
                delete parsedQuery.redirect;
                delete parsedQuery.deep;

                if (encodeForDeepLink) {
                    var isDeepLinkParam = function(p) { return p.startsWith("deep_link_") || p.includes("deeplink"); };
                    var noDeepLinkSearch = objectToQuery(parsedQuery, function(p) { return !isDeepLinkParam(p); });
                    searchWithCookies = addCookies(objectToQuery(Object.assign(parsedQuery, { "deep_link_sub10": removeQuestionMark(noDeepLinkSearch) }), isDeepLinkParam));
                } else {
                    var search = objectToQuery(parsedQuery);
                    searchWithCookies = addCookies(search);
                }
                if (redirect) {
                    setTimeout(function() {
                        window.location.replace(redirect + searchWithCookies);
                    }, 25);
                    if (scheme) {
                        window.location.replace("uniqorn://" + searchWithCookies);
                    }
                } else {
                    alert("Specify redirect parameter");
                }
            } else {
                setTimeout(function() {
                    elapsedTime += 10;
                    waitForCookiesAndRedirect();
                }, 10);
            }
        }
        window.addEventListener('load', function () {
            waitForCookiesAndRedirect();
