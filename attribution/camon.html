    <script>
        function parseQuery(queryString) {
            var query = {};
            var pairs = (queryString[0] === '?' ? queryString.substr(1) : queryString).split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                query[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
            }
            return query;
        }
        function waitForCookiesAndRedirect() {
            setTimeout(function() {
                if (document.cookie.includes("fbp=")) {
                    var redirect = parseQuery(window.location.search).redirect || 'https://camo.onelink.me/kAXu/qxlztrfz';
                    var search = window.location.search;
                    window.location.replace(redirect + search + (search.length > 1 ? "&" : (search.length > 0 ? "" : "?")) + document.cookie.replaceAll("; ", "&"));
                } else {
                    waitForCookiesAndRedirect();
                }
            }, 10);
        }
