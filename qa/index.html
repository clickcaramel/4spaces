<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" href="styles.css">

  <title>My first BootstrapVue app</title>

  <!-- Required Stylesheets -->
  <link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css" />
  <link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.css" />

  <!-- Load polyfills to support older browsers -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es2015%2CIntersectionObserver"></script>

  <!-- Required scripts -->
  <script src="https://unpkg.com/vue@latest/dist/vue.js"></script>
  <script src="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.js"></script>
</head>

<body>
  <!-- Our application root element -->
  <div id="app">
    <b-container class=continer>
      <form @submit.stop.prevent>
        <b-row class="mb-3">
          <h6>Name<span class="asterisk">*</span></h4>
            <b-col cols="12" lg="6">
              <input type="text" placeholder="Last" required v-model="form.lastName">
            </b-col>
            <b-col cols="12" lg="6">
              <input type="text" placeholder="First" required v-model="form.firstName">
            </b-col>
        </b-row>

        <b-row class="mb-3">
          <h6>Adress<span class="asterisk">*</span></h6>
          <b-col cols="12" class="mb-3">
            <input type="text" placeholder="Street Address" v-model="form.fullAddress">
          </b-col>
          <b-col cols="12">
            <input type="text" placeholder="Street Adress Line 2" required v-model="form.fullAddressExtra">
          </b-col>
        </b-row>

        <b-row class="mb-3">
          <h6 style="margin-left: 15px;">Optional Address Info</h6>
          <b-col cols="6">
            <input type="text" placeholder="City" required v-model="form.city">
          </b-col>
          <b-col cols="6">
            <input type="text" placeholder="Region" required v-model="form.region">
          </b-col>
        </b-row>

        <b-row class="mb-3">
          <b-col cols="12" lg="6">
            <input type="text" class="mb-3" placeholder="Postal / Zip Codes" v-model="form.zip">
          </b-col>
          <b-col cols="12" lg="6">
            <input type="text" class="mb-3 country" placeholder="Postal / Zip Codes" v-model="form.country">
            <!-- <select v-model="form.country">
              <option value="country.name" v-for="country in countries">{{ country.name }}</option>
            </select> -->
          </b-col>
        </b-row>

        <b-row class="mb-3">
          <h6>Phoen<span class="asterisk">*</span></h6>
          <b-col cols="12" class="mb-3">
            <input type="email" placeholder="" required v-model="form.email">
          </b-col>
          <h6>Email<span class="asterisk">*</span></h6>
          <b-col cols="12" class="mb-3">
            <input type="text" placeholder="" required v-model="form.phone">
          </b-col>
        </b-row>

        <button :class="`btn btn-success ${emptyRequiredFileds ? 'disabled' : ''}`" @click="submitForm">Submit</button>
      </form>
      <div v-if="this.alert" class="alert mt-3">
        <h6 class="">Missing fields:</h6>
        <ul>
          <li v-if="!this.form.firstName">First Name</li>
          <li v-if="!this.form.lastName">Last Name</li>
          <li v-if="!this.form.fullAddress">Full Address</li>
          <li v-if="!this.form.phone">Phone</li>
          <li v-if="!this.form.email || !validEmail">Email</li>
        </ul>
        <div v-if="!emptyRequiredFileds && oopsCase">Oooops! Something is still missing</div>
      </div>
      <div v-if="this.success" class="success mt-3 pa-3">
        <h6 class="">Success!</h6>
        <div>Thank you for submitting details!</div>
        <div>We will give your a call at {{ this.form.email }}</div>
      </div>
    </b-container>
  </div>

          {

          },
          {

          },
          {
            "name": "Zambia",
            "code": "ZM"
          },
          {
            "name": "Zimbabwe",
            "code": "ZW"
          }
        ],
        form: {
          firstName: '',
          lastName: '',
          fullAddress: '',
          fullAddressExtra: '',
          city: '',
          region: '',
          zip: '',
          country: null,
          phone: '',
          email: ''
        },
        alert: false,
        success: false
      },
      computed: {
        emptyRequiredFileds() {
          return (!this.form.firstName || !this.form.lastName || !this.form.fullAddress || !this.form.phone || !this.form.email)
        },
        oopsCase() {
          return (!this.form.fullAddressExtra || !this.form.city || !this.form.region)
        },
        validEmail() {
          const tester = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
          return tester.test(String(this.form.email).toLowerCase())
        }
      },
      methods: {
        resetForm() {
          this.form.firstName = ''
          this.form.lastName = ''
          this.form.fullAddress = ''
          this.form.fullAddressExtra = ''
          this.form.city = ''
          this.form.region = ''
          this.form.zip = ''
          this.form.country = null
          this.form.phone = ''
          this.form.email = ''
          this.alert = false
          this.success = false
        },
        submitForm(e) {
          const tester = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
          const validEmail = tester.test(String(this.form.email).toLowerCase())
          if (!this.form.firstName || !this.form.lastName || !this.form.fullAddress || !this.form.phone || !this.form.email || !validEmail || !this.form.fullAddressExtra || !this.form.city || !this.form.region) {
            this.alert = true
            this.success = false
            setTimeout(() => this.alert = false, 2000)
          } else {
            this.alert = false
            this.success = true
          }
        },
        checkPhoneNr(event) {
          if (event.keyCode == 46 || event.keyCode == 8 || event.keyCode == 9 || event.keyCode == 27 || event.keyCode == 110 ||
            (event.keyCode == 65 && event.ctrlKey === true) ||
            (event.keyCode >= 35 && event.keyCode <= 39)) {
          } else {
            if ((event.keyCode < 48 || event.keyCode > 57) && (event.keyCode < 96 || event.keyCode > 105)) {
              event.preventDefault();
            }
          }

        }
      }
    })
  </script>
