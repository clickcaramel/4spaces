---
# yamllint disable rule:line-length
Description: CI stack for testing, building and deploying 4spaces
Parameters:
  Certificate:
    Description: Certificate ARN for CloudFront
    Type: String
  Branch:
    AllowedValues:
      - master
      - develop
    Default: master
    Description: Environment where the application will be deployed to
    Type: String
  GitHubRepository:
    Default: 4spaces-web
    Description: GitHub repository name
    Type: String
  GitHubToken:
    NoEcho: true
    Description: GitHub Token
    Type: String
  GitHubOwner:
    Default: clickcaramel
    Description: GitHub User
    Type: String
  HostedZoneName:
    AllowedValues:
      - 4spaces.company
    Description: Zone where DNS records will be added
    Type: String
Resources:

  4spacesBuildPolicy:
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:*
          - Action:
              - cloudfront:*
            Effect: Allow
            Resource: '*'
          - Action:
              - s3:*
            Effect: Allow
            Resource:
              - Fn::Sub: arn:aws:s3:::${4spacesPipelineBucket}/*
              - Fn::Sub: arn:aws:s3:::${4spacesPipelineBucket}
              - Fn::Sub: arn:aws:s3:::4spaces-web-${AWS::Region}-${Branch}
              - Fn::Sub: arn:aws:s3:::4spaces-web-${AWS::Region}-${Branch}/*
        Version: '2012-10-17'
      PolicyName: 4spacesBuildPolicy
      Roles:
        - Ref: 4spacesBuildRole
    Type: AWS::IAM::Policy

  4spacesBuildRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
        Version: '2012-10-17'
      Path: /
    Type: AWS::IAM::Role

  4spacesCodePipelinePolicy:
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - s3:*
              - cloudformation:*
              - iam:PassRole
            Effect: Allow
            Resource: '*'
          - Action:
              - codebuild:BatchGetBuilds
              - codebuild:StartBuild
            Effect: Allow
            Resource: '*'
        Version: '2012-10-17'
      PolicyName: 4spacesCodePipelinePolicy
      Roles:
        - Ref: 4spacesCodePipelineRole
    Type: AWS::IAM::Policy

  4spacesCodePipelineRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com
                - codepipeline.amazonaws.com
        Version: '2012-10-17'
      Path: /
    Type: AWS::IAM::Role

  4spacesDeployerPolicy:
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - lambda:*
              - logs:*
              - s3:*
              - cloudformation:*
              - cloudfront:*
              - cloudwatch:*
              - iam:*
              - route53:*
              - events:*
            Effect: Allow
            Resource: '*'
        Version: '2012-10-17'
      PolicyName: 4spacesDeployerPolicy
      Roles:
        - Ref: 4spacesDeployerRole
    Type: AWS::IAM::Policy

  4spacesDeployerRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
        Version: '2012-10-17'
      Path: /
    Type: AWS::IAM::Role

  4spacesPipeline:
    Properties:
      ArtifactStore:
        Location:
          Ref: 4spacesPipelineBucket
        Type: S3
      Name:
        Fn::Sub: SpacesWeb-${Branch}
      RoleArn:
        Fn::GetAtt:
          - 4spacesCodePipelineRole
          - Arn
      Stages:
        - Actions:
            - ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Branch:
                  Ref: Branch
                OAuthToken:
                  Ref: GitHubToken
                Owner:
                  Ref: GitHubOwner
                Repo:
                  Ref: GitHubRepository
              InputArtifacts: []
              Name: Source
              OutputArtifacts:
                - Name: Sources
              RunOrder: 1
          Name: Source

        - Actions:
            - ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                Capabilities: CAPABILITY_IAM
                ParameterOverrides:
                  Fn::Join:
                    - ''
                    - - '{ '
                      - Fn::Sub: '"Certificate": "${Certificate}", '
                      - Fn::Sub: '"HostedZoneName": "${HostedZoneName}", '
                      - Fn::Sub: '"Branch": "${Branch}" '
                      - '}'
                RoleArn:
                  Fn::GetAtt:
                    - 4spacesDeployerRole
                    - Arn
                StackName:
                  Fn::Sub: SpacesWeb-${Branch}
                TemplatePath: Sources::CloudFormation.yaml
              InputArtifacts:
                - Name: Sources
              Name: DeployInfrastructure
              RunOrder: 1

            - ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName:
                  Ref: 4spacesWebDeploy
              InputArtifacts:
                - Name: Sources
              Name: DeployWebapp
              OutputArtifacts:
                - Name: Webapp
              RunOrder: 2
          Name: Deploy
    Type: AWS::CodePipeline::Pipeline

  4spacesPipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: Delete old artifacts
            Prefix: ""
            Status: Enabled
            ExpirationInDays: 14

  4spacesWebDeploy:
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Description:
        Fn::Sub: Deploys 4spaces Webapp for ${Branch}
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:2.0-1.13.0
        Type: LINUX_CONTAINER
      Name:
        Fn::Sub: 4spacesWebDeploy-${Branch}
      ServiceRole:
        Fn::GetAtt:
          - 4spacesBuildRole
          - Arn
      Source:
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 10
                python: 3.7
            build:
              commands:
                - aws s3 rm --recursive s3://4spaces-web-${AWS::Region}-${Branch} --region ${AWS::Region}
                - aws s3 sync ./ s3://4spaces-web-${AWS::Region}-${Branch} --cache-control "max-age=300" --region ${AWS::Region}
                - 'aws configure set preview.cloudfront true && aws cloudfront create-invalidation --distribution-id `aws cloudfront list-distributions | node -pe "JSON.parse(require(\"fs\").readFileSync(\"/dev/stdin\").toString()).DistributionList.Items.filter(function(i) { return i.Comment.indexOf(\"4spaces for ${Branch}\") >= 0; })[0].Id"` --paths "/*"'
          artifacts:
            files:
              - ./css/**/*
              - ./images/**/*
              - ./js/**/*
              - ./fonts/**/*
              - ./index.html
        Type: CODEPIPELINE
      TimeoutInMinutes: 10
    Type: AWS::CodeBuild::Project
